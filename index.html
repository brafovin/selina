<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Super Selina Kart</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: "Courier New", monospace;
    overflow: hidden;
    height: 100%;
    user-select: none;
  }
  #wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #000;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 30px #000;
    max-width: 100vw;
    max-height: 100vh;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 18px;
    text-shadow: 2px 2px 0 #000;
    pointer-events: none;
  }
  #title {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 10;
  }
  #title h1 {
    font-size: 48px;
    color: #ffcc00;
    text-shadow: 4px 4px 0 #d40000, 6px 6px 0 #000;
    margin: 0 0 8px;
    letter-spacing: 2px;
  }
  #title p { margin: 6px 0; font-size: 16px; }
  #title button {
    margin-top: 18px;
    font-family: inherit;
    font-size: 22px;
    padding: 10px 26px;
    background: #ffcc00;
    color: #000;
    border: 4px solid #fff;
    cursor: pointer;
  }
  #title button:hover { background: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="640" height="480"></canvas>
  </div>
  <div id="hud"></div>
  <div id="title">
    <h1>SUPER SELINA KART</h1>
    <p>Pfeiltasten: Lenken / Gas / Bremse</p>
    <p>Leertaste: Hupe &nbsp; • &nbsp; Shift: Drift</p>
    <p>Blaue Pads = BOOST! &nbsp; • &nbsp; Such die geheime Abkürzung!</p>
    <p>3 Runden — schlag die Gegner!</p>
    <button id="startBtn">START</button>
  </div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const hud = document.getElementById("hud");
  const titleEl = document.getElementById("title");
  const startBtn = document.getElementById("startBtn");

  // ---- Track map (Mode-7 style top-down bitmap) ----
  // Letters: G=grass, R=road, S=start/finish, W=wall, C=checkpoint(road)
  // Tiles: G=grass, R=road, S=start/finish, B=boost pad, H=hidden shortcut (dirt path)
  const MAP = [
    "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
    "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
    "GGGGRRRRRRRRRRRRRRRRRRRRRRRRGGGG",
    "GGGRRRRRRRRRBBRRRRRRRRRRRRRRRGGG",
    "GGRRRRRRRRRRRRRRRRRRRRRRRRRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRBRGGGGGGGGGHHGGGGGGGGGRBRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRRRGGGGGGGGGHHGGGGGGGGGRRRRGG",
    "GGRRSSSSSSSSSSSSSSSSSSSSSSSSRRGG",
    "GGRRRRRRRRRRRRBBRRRRRRRRRRRRRRGG",
    "GGGRRRRRRRRRRRRRRRRRRRRRRRRRRGGG",
    "GGGGRRRRRRRRRRRRRRRRRRRRRRRRGGGG",
    "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
  ];
  const MAP_W = MAP[0].length;
  const MAP_H = MAP.length;
  const TILE = 64; // world units per tile

  function tileAt(wx, wy) {
    const tx = Math.floor(wx / TILE);
    const ty = Math.floor(wy / TILE);
    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return "G";
    return MAP[ty][tx];
  }
  function isRoad(c) { return c === "R" || c === "S" || c === "C" || c === "B" || c === "H"; }
  function isBoost(c) { return c === "B"; }

  // ---- Build a tile texture image (Mode-7 source) ----
  // We render the whole map into an offscreen canvas at high res, then sample it for Mode-7.
  const TEX_TILE = 32; // pixels per tile in the source texture
  const tex = document.createElement("canvas");
  tex.width = MAP_W * TEX_TILE;
  tex.height = MAP_H * TEX_TILE;
  const tctx = tex.getContext("2d");

  function drawTileTex() {
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const c = MAP[y][x];
        const px = x * TEX_TILE, py = y * TEX_TILE;
        if (c === "G") {
          // grass with checker
          tctx.fillStyle = "#1f9c2e";
          tctx.fillRect(px, py, TEX_TILE, TEX_TILE);
          tctx.fillStyle = "#178a26";
          for (let yy = 0; yy < TEX_TILE; yy += 8)
            for (let xx = 0; xx < TEX_TILE; xx += 8)
              if (((xx + yy) >> 3) & 1)
                tctx.fillRect(px + xx, py + yy, 8, 8);
        } else if (c === "R") {
          tctx.fillStyle = "#5a4a3a";
          tctx.fillRect(px, py, TEX_TILE, TEX_TILE);
          tctx.fillStyle = "#6b5848";
          tctx.fillRect(px, py, TEX_TILE, TEX_TILE / 2);
        } else if (c === "S") {
          for (let yy = 0; yy < TEX_TILE; yy += 4)
            for (let xx = 0; xx < TEX_TILE; xx += 4) {
              tctx.fillStyle = (((xx + yy) >> 2) & 1) ? "#fff" : "#000";
              tctx.fillRect(px + xx, py + yy, 4, 4);
            }
        } else if (c === "B") {
          // boost pad: cyan/blue with chevrons
          tctx.fillStyle = "#0a2858";
          tctx.fillRect(px, py, TEX_TILE, TEX_TILE);
          tctx.fillStyle = "#3ad1ff";
          for (let i = 0; i < 3; i++) {
            const yy = py + 4 + i * 9;
            tctx.beginPath();
            tctx.moveTo(px + 4,             yy + 6);
            tctx.lineTo(px + TEX_TILE/2,    yy);
            tctx.lineTo(px + TEX_TILE - 4,  yy + 6);
            tctx.lineTo(px + TEX_TILE - 4,  yy + 9);
            tctx.lineTo(px + TEX_TILE/2,    yy + 3);
            tctx.lineTo(px + 4,             yy + 9);
            tctx.closePath();
            tctx.fill();
          }
        } else if (c === "H") {
          // hidden shortcut: dirt path that blends with grass
          tctx.fillStyle = "#1f9c2e";
          tctx.fillRect(px, py, TEX_TILE, TEX_TILE);
          tctx.fillStyle = "#8c6a3f";
          tctx.fillRect(px + 4, py, TEX_TILE - 8, TEX_TILE);
          tctx.fillStyle = "#6b4f2a";
          for (let i = 0; i < 6; i++) {
            const rx = px + 6 + ((i * 7) % (TEX_TILE - 12));
            const ry = py + ((i * 13) % (TEX_TILE - 4));
            tctx.fillRect(rx, ry, 3, 2);
          }
          // tufts of grass at edges
          tctx.fillStyle = "#178a26";
          for (let i = 0; i < TEX_TILE; i += 6) {
            tctx.fillRect(px + 2, py + i, 2, 3);
            tctx.fillRect(px + TEX_TILE - 4, py + i + 3, 2, 3);
          }
        }
      }
    }
    // road borders
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const c = MAP[y][x];
        if (!isRoad(c)) continue;
        if (c === "H") continue; // hidden shortcut has no curb so it blends in
        const px = x * TEX_TILE, py = y * TEX_TILE;
        const neighbors = [
          [0,-1],[0,1],[-1,0],[1,0],
        ];
        for (const [dx,dy] of neighbors) {
          const nx = x+dx, ny = y+dy;
          if (nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
          const nc = MAP[ny][nx];
          if (!isRoad(nc)) {
            // draw red/white curb stripe
            tctx.save();
            for (let i = 0; i < TEX_TILE; i += 8) {
              tctx.fillStyle = (i & 8) ? "#ff2020" : "#ffffff";
              if (dy === -1) tctx.fillRect(px+i, py, 8, 4);
              if (dy ===  1) tctx.fillRect(px+i, py+TEX_TILE-4, 8, 4);
              if (dx === -1) tctx.fillRect(px, py+i, 4, 8);
              if (dx ===  1) tctx.fillRect(px+TEX_TILE-4, py+i, 4, 8);
            }
            tctx.restore();
          }
        }
      }
    }
  }
  drawTileTex();

  // ---- Pre-extract texture pixels for fast Mode-7 ----
  const texData = tctx.getImageData(0, 0, tex.width, tex.height).data;

  // ---- Karts ----
  const startX = 4 * TILE + TILE/2;
  const startY = 25 * TILE + TILE/2;
  function makeKart(color, isPlayer) {
    return {
      x: startX,
      y: startY,
      angle: -Math.PI/2,
      vx: 0, vy: 0,
      color,
      isPlayer: !!isPlayer,
      lap: 0,
      wp: 1,
      passedTop: false,
      boostTime: 0,
      sprite: null,
    };
  }
  const player = makeKart("#e02020", true);
  const cpus = [
    makeKart("#ffd92e", false),
    makeKart("#3aa3ff", false),
    makeKart("#7cd24a", false),
  ];
  // stagger starting positions
  player.y = startY - 6;
  cpus[0].x = startX + 28; cpus[0].y = startY + 12;
  cpus[1].x = startX - 28; cpus[1].y = startY + 12;
  cpus[2].x = startX;      cpus[2].y = startY + 28;

  // ---- Kart sprites (drawn procedurally) ----
  function makeKartSprite(color) {
    const c = document.createElement("canvas");
    c.width = 48; c.height = 40;
    const g = c.getContext("2d");
    // shadow
    g.fillStyle = "rgba(0,0,0,0.35)";
    g.beginPath(); g.ellipse(24, 36, 18, 4, 0, 0, Math.PI*2); g.fill();
    // body
    g.fillStyle = color;
    g.fillRect(10, 14, 28, 18);
    g.fillStyle = "#222";
    g.fillRect(8, 28, 6, 8);
    g.fillRect(34, 28, 6, 8);
    g.fillRect(8, 12, 6, 8);
    g.fillRect(34, 12, 6, 8);
    // driver
    g.fillStyle = "#ffd1a4";
    g.fillRect(18, 6, 12, 10);
    g.fillStyle = "#fff";
    g.fillRect(16, 2, 16, 6);
    g.fillStyle = "#000";
    g.fillRect(20, 9, 2, 2);
    g.fillRect(26, 9, 2, 2);
    // windshield strip
    g.fillStyle = "rgba(120,200,255,0.7)";
    g.fillRect(14, 16, 20, 4);
    return c;
  }
  player.sprite = makeKartSprite(player.color);
  cpus.forEach(k => k.sprite = makeKartSprite(k.color));

  // ---- Input ----
  const keys = {};
  addEventListener("keydown", e => { keys[e.key.toLowerCase()] = true; if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault(); });
  addEventListener("keyup",   e => { keys[e.key.toLowerCase()] = false; });

  // ---- Audio ----
  let actx = null;
  let engineOsc = null, engineGain = null;
  function ensureAudio() {
    if (actx) return;
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      engineOsc = actx.createOscillator();
      engineGain = actx.createGain();
      engineOsc.type = "sawtooth";
      engineOsc.frequency.value = 80;
      engineGain.gain.value = 0;
      engineOsc.connect(engineGain);
      engineGain.connect(actx.destination);
      engineOsc.start();
    } catch(e){}
  }
  function setEngine(speed, onRoad) {
    if (!actx || !engineOsc) return;
    const s = Math.abs(speed);
    const target = 60 + s * 1.4;
    engineOsc.frequency.setTargetAtTime(target, actx.currentTime, 0.05);
    const vol = Math.min(0.06, 0.012 + s/8000) * (onRoad ? 1 : 1.4);
    engineGain.gain.setTargetAtTime(vol, actx.currentTime, 0.08);
  }
  function beep(freq, dur=0.08, type="square", vol=0.05) {
    if (!actx) return;
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur + 0.02);
  }

  // ---- Game state ----
  let running = false;
  let totalLaps = 3;
  let raceStart = 0;
  let countdown = 3;
  let countdownTimer = 0;
  let finished = false;
  let finishOrder = [];
  let bgOffset = 0;
  let flashBoost = 0;

  function startRace() {
    running = true;
    countdown = 3;
    countdownTimer = performance.now();
    raceStart = 0;
    finished = false;
    finishOrder = [];
    ensureAudio();
  }

  startBtn.addEventListener("click", () => {
    titleEl.classList.add("hidden");
    startRace();
  });

  // ---- Physics (velocity vector with grip / inertia) ----
  function stepKart(k, steerInput, throttle, brake, drift, dt) {
    const currentTile = tileAt(k.x, k.y);
    const onRoad = isRoad(currentTile);

    // Boost pad: trigger once on entry, lasts ~1.2s
    if (isBoost(currentTile) && k.boostTime <= 0.5) {
      k.boostTime = 1.4;
      if (k.isPlayer) {
        beep(1200, 0.08, "square", 0.06);
        beep(1600, 0.12, "sawtooth", 0.05);
        flashBoost = 0.5;
      }
    }
    if (k.boostTime > 0) k.boostTime -= dt;

    // Decompose world velocity into forward / lateral relative to facing
    const cosA = Math.cos(k.angle), sinA = Math.sin(k.angle);
    let fwd =  cosA * k.vx + sinA * k.vy;
    let lat = -sinA * k.vx + cosA * k.vy;

    // Engine forces
    const boosting = k.boostTime > 0;
    const maxFwd = boosting ? 560 : (onRoad ? 360 : 150);
    const maxRev = -120;
    const accel  = boosting ? 900 : (onRoad ? 280 : 110);
    const brakeF = 520;
    const engineBrake = onRoad ? 90 : 220;

    if (boosting && fwd < maxFwd) {
      fwd += accel * dt;
    } else if (throttle && !brake) {
      fwd += accel * dt;
    } else if (brake && !throttle) {
      // brake if moving forward, otherwise reverse
      if (fwd > 0) fwd = Math.max(0, fwd - brakeF * dt);
      else        fwd = Math.max(maxRev, fwd - accel * 0.6 * dt);
    } else {
      // engine braking
      if (fwd > 0) fwd = Math.max(0, fwd - engineBrake * dt);
      if (fwd < 0) fwd = Math.min(0, fwd + engineBrake * dt);
    }
    fwd = Math.max(maxRev, Math.min(maxFwd, fwd));

    // Steering: rate scales with forward speed (no turn while still)
    const speedFactor = Math.min(1, Math.abs(fwd) / 120);
    const baseSteer = drift ? 2.4 : 3.0;
    // less responsive at very high speed (understeer)
    const steerRate = baseSteer * (1 - Math.min(0.45, Math.abs(fwd)/900));
    const dir = fwd >= 0 ? 1 : -1;
    k.angle += steerInput * steerRate * speedFactor * dir * dt;

    // Lateral grip: how quickly lateral velocity bleeds off
    // Drift = low grip → car slides
    let gripPerSec = onRoad ? (drift ? 1.4 : 5.5) : 0.9;
    lat *= Math.max(0, 1 - gripPerSec * dt);

    // Recompose world velocity
    k.vx =  cosA * fwd - sinA * lat;
    k.vy =  sinA * fwd + cosA * lat;

    // Move with sub-step + wall handling on the road border
    const steps = 3;
    const sdt = dt / steps;
    for (let s = 0; s < steps; s++) {
      let nx = k.x + k.vx * sdt;
      let ny = k.y + k.vy * sdt;

      // hard map edge
      nx = Math.max(TILE, Math.min((MAP_W-1)*TILE - 1, nx));
      ny = Math.max(TILE, Math.min((MAP_H-1)*TILE - 1, ny));

      // probe horizontal and vertical separately so we slide along the grass border
      const wasOn = isRoad(tileAt(k.x, k.y));
      const onAfterX = isRoad(tileAt(nx, k.y));
      const onAfterY = isRoad(tileAt(k.x, ny));

      // If we were on the road and now hit grass moving in one axis,
      // bounce a bit and lose energy on that axis. Otherwise allow it.
      if (wasOn && !onAfterX) {
        // moving sideways off the road → bounce back, kill velocity
        k.vx *= -0.25;
      } else {
        k.x = nx;
      }
      if (wasOn && !onAfterY) {
        k.vy *= -0.25;
      } else {
        k.y = ny;
      }
    }

    // Off-road rumble drag (in addition to lower top speed)
    if (!onRoad) {
      const drag = 0.6 * dt;
      k.vx *= Math.max(0, 1 - drag);
      k.vy *= Math.max(0, 1 - drag);
    }

    // Store last computed forward speed for HUD / sound
    k.speed = Math.hypot(k.vx, k.vy) * (fwd >= 0 ? 1 : -1);
    k.fwd = fwd;
    k.onRoad = onRoad;
  }

  // Waypoint loop (counter-clockwise around the oval, inside the road band)
  const waypoints = [
    {x: 3.5*TILE,  y: 25*TILE},
    {x: 3.5*TILE,  y: 14*TILE},
    {x: 3.5*TILE,  y: 4*TILE},
    {x: 14*TILE,   y: 3.5*TILE},
    {x: 27*TILE,   y: 3.5*TILE},
    {x: 28.5*TILE, y: 14*TILE},
    {x: 28.5*TILE, y: 25*TILE},
    {x: 22*TILE,   y: 26.5*TILE},
    {x: 10*TILE,   y: 26.5*TILE},
  ];
  function aiStep(k, dt) {
    const target = waypoints[k.wp];
    const dx = target.x - k.x, dy = target.y - k.y;
    const dist = Math.hypot(dx, dy);
    if (dist < TILE * 1.4) k.wp = (k.wp + 1) % waypoints.length;
    const desired = Math.atan2(dy, dx);
    let diff = desired - k.angle;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    const steer = Math.max(-1, Math.min(1, diff * 1.8));
    // throttle off slightly for sharp upcoming turns
    const sharp = Math.abs(diff) > 0.9;
    stepKart(k, steer, !sharp || Math.abs(k.fwd||0) < 120, sharp && Math.abs(k.fwd||0) > 200, Math.abs(diff) > 0.7, dt);
  }

  // ---- Lap tracking (requires hitting BOTH the top and the right side) ----
  function trackLap(k) {
    const ty = Math.floor(k.y / TILE);
    const tx = Math.floor(k.x / TILE);
    if (ty <= 4 && tx >= 4 && tx <= 27) k.passedTop = true;
    if (tx >= 26 && ty >= 4 && ty <= 25) k.passedRight = true;
    if (k.passedTop && k.passedRight && ty >= 25 && ty <= 26 && tx >= 4 && tx <= 27) {
      k.lap += 1;
      k.passedTop = false;
      k.passedRight = false;
      if (k.isPlayer) beep(880, 0.2, "square", 0.08);
      if (k.lap >= totalLaps && !finishOrder.includes(k)) {
        finishOrder.push(k);
        if (k.isPlayer) finished = true;
      }
    }
  }

  // ---- Mode-7 renderer ----
  function renderMode7() {
    // Sky / background
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H/2);
    skyGrad.addColorStop(0, "#3aa6ff");
    skyGrad.addColorStop(1, "#cbe9ff");
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, W, H/2);

    // Distant mountains
    ctx.fillStyle = "#5a7a2a";
    ctx.beginPath();
    ctx.moveTo(0, H/2);
    const baseY = H/2;
    for (let i = 0; i <= 12; i++) {
      const x = (i / 12) * W;
      const peakOffset = ((i * 73 + (bgOffset|0)) % 200) - 100;
      ctx.lineTo(x, baseY - 40 - Math.abs(peakOffset)/3);
      ctx.lineTo(x + W/24, baseY);
    }
    ctx.lineTo(W, H/2);
    ctx.closePath();
    ctx.fill();

    // Mode-7 floor
    const img = ctx.createImageData(W, H/2);
    const data = img.data;
    const cosA = Math.cos(player.angle + Math.PI/2);
    const sinA = Math.sin(player.angle + Math.PI/2);
    const horizon = 0;
    const camHeight = 80;
    const fov = 250;
    const camX = player.x;
    const camY = player.y;

    for (let y = 0; y < H/2; y++) {
      const screenY = y + 1;
      const z = (camHeight * fov) / screenY;
      const fog = Math.max(0, 1 - screenY / (H/2));
      const fr = 1 - fog * 0.8;
      for (let x = 0; x < W; x++) {
        const px = ((x - W/2) * z) / fov;
        const wx = camX + (cosA * z - sinA * px);
        const wy = camY + (sinA * z + cosA * px);
        const tx = ((wx / TILE) * TEX_TILE) | 0;
        const ty = ((wy / TILE) * TEX_TILE) | 0;
        let r, g, b;
        if (tx < 0 || ty < 0 || tx >= tex.width || ty >= tex.height) {
          r = 31; g = 156; b = 46;
        } else {
          const idx = (ty * tex.width + tx) * 4;
          r = texData[idx]; g = texData[idx+1]; b = texData[idx+2];
        }
        r = (r * fr + (1-fr)*203) | 0;
        g = (g * fr + (1-fr)*233) | 0;
        b = (b * fr + (1-fr)*255) | 0;
        const di = (y * W + x) * 4;
        data[di]     = r;
        data[di + 1] = g;
        data[di + 2] = b;
        data[di + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, H/2);
  }

  // ---- Project a world point into screen space ----
  function projectWorld(wx, wy) {
    const cosA = Math.cos(player.angle + Math.PI/2);
    const sinA = Math.sin(player.angle + Math.PI/2);
    const fov = 250;
    const camHeight = 80;
    // inverse of the floor mapping:
    // wx = camX + cosA*z - sinA*px ; wy = camY + sinA*z + cosA*px
    const dx = wx - player.x;
    const dy = wy - player.y;
    // z = cosA*dx + sinA*dy ; px = -sinA*dx + cosA*dy
    const z =  cosA*dx + sinA*dy;
    const px = -sinA*dx + cosA*dy;
    if (z <= 1) return null;
    const screenY = (camHeight * fov) / z;
    if (screenY < 1) return null;
    const sy = H/2 + screenY;
    const sx = W/2 + (px * fov) / z;
    const scale = fov / z;
    return { sx, sy, scale, z };
  }

  function drawKartSprite(k) {
    if (k.isPlayer) return;
    const p = projectWorld(k.x, k.y);
    if (!p) return;
    const sprite = k.sprite;
    const s = Math.max(0.2, Math.min(2.5, p.scale * 0.7));
    const w = sprite.width * s;
    const h = sprite.height * s;
    ctx.drawImage(sprite, p.sx - w/2, p.sy - h, w, h);
  }

  function drawPlayerKart() {
    // Always centered, slightly bouncing
    const t = performance.now() / 100;
    const bounce = Math.sin(t) * 2 * Math.min(1, Math.abs(player.speed)/200);
    const w = 220, h = 180;
    ctx.drawImage(player.sprite, W/2 - w/2, H - h + bounce, w, h);
  }

  function drawHUD() {
    const lap = Math.max(1, Math.min(totalLaps, player.lap + 1));
    const place = computePlace();
    const speed = Math.abs(player.speed)|0;
    hud.innerHTML = `
      <div>LAP ${lap}/${totalLaps}</div>
      <div>PLACE ${place}/4</div>
      <div>SPEED ${speed}</div>
    `;
  }

  function computePlace() {
    const all = [player, ...cpus];
    // by lap progress: lap + fraction along route based on waypoint distance
    function score(k) {
      const w = k.wp || 0;
      const next = waypoints[w] || waypoints[0];
      const d = Math.hypot(next.x - k.x, next.y - k.y);
      return k.lap * 1000 + w * 200 - d / 10;
    }
    const sorted = all.slice().sort((a,b) => score(b) - score(a));
    return sorted.indexOf(player) + 1;
  }

  // ---- Big text overlay ----
  function drawText(text, y, size=64, color="#fff") {
    ctx.font = `bold ${size}px Courier New, monospace`;
    ctx.textAlign = "center";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#000";
    ctx.strokeText(text, W/2, y);
    ctx.fillStyle = color;
    ctx.fillText(text, W/2, y);
  }

  // ---- Main loop ----
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    bgOffset += dt * 20 * (player.speed/200);

    if (running) {
      // countdown
      if (countdown > 0) {
        if (now - countdownTimer > 1000) {
          countdown -= 1;
          countdownTimer = now;
          if (countdown >= 0) beep(countdown === 0 ? 1200 : 600, 0.15);
        }
      } else {
        // input
        let steer = 0, throttle = false, brake = false, drift = false;
        if (keys["arrowleft"]  || keys["a"]) steer -= 1;
        if (keys["arrowright"] || keys["d"]) steer += 1;
        if (keys["arrowup"]    || keys["w"]) throttle = true;
        if (keys["arrowdown"]  || keys["s"]) brake = true;
        if (keys["shift"])  drift = true;
        if (keys[" "]) { /* horn */ if ((now|0) % 200 < 16) beep(440,0.05,"sawtooth",0.06); }
        if (!finished) {
          stepKart(player, steer, throttle, brake, drift, dt);
        } else {
          stepKart(player, 0, false, true, false, dt);
        }
        trackLap(player);
        for (const k of cpus) { aiStep(k, dt); trackLap(k); }
      }
      setEngine(player.speed || 0, player.onRoad !== false);
    }

    // ---- Render ----
    renderMode7();

    // Sort CPU karts back-to-front for proper draw order
    const others = cpus.slice().map(k => {
      const dx = k.x - player.x, dy = k.y - player.y;
      const cosA = Math.cos(player.angle + Math.PI/2);
      const sinA = Math.sin(player.angle + Math.PI/2);
      const z = cosA*dx + sinA*dy;
      return { k, z };
    }).sort((a,b) => b.z - a.z);
    for (const {k} of others) drawKartSprite(k);

    drawPlayerKart();

    // Boost effect: speed lines + flash + colored vignette
    if (player.boostTime > 0) {
      ctx.save();
      ctx.globalAlpha = 0.6;
      ctx.strokeStyle = "#3ad1ff";
      ctx.lineWidth = 2;
      const lines = 14;
      const t = now / 30;
      for (let i = 0; i < lines; i++) {
        const ang = (i / lines) * Math.PI * 2 + t * 0.05;
        const r1 = 180 + (i*37 + t) % 80;
        const r2 = r1 + 80;
        ctx.beginPath();
        ctx.moveTo(W/2 + Math.cos(ang)*r1, H/2 + Math.sin(ang)*r1);
        ctx.lineTo(W/2 + Math.cos(ang)*r2, H/2 + Math.sin(ang)*r2);
        ctx.stroke();
      }
      ctx.restore();
    }
    if (flashBoost > 0) {
      ctx.save();
      ctx.globalAlpha = flashBoost;
      ctx.fillStyle = "#3ad1ff";
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
      flashBoost -= dt * 2.5;
    }

    drawHUD();

    if (running && countdown > 0) {
      drawText(countdown === 3 ? "READY?" : (""+countdown), H/2 + 30, 96, "#ffcc00");
    } else if (running && countdown === 0 && now - countdownTimer < 800) {
      drawText("GO!", H/2 + 30, 120, "#22ff44");
    }

    if (finished) {
      const place = finishOrder.indexOf(player) + 1;
      drawText(place === 1 ? "YOU WIN!" : `FINISH! P${place}`, H/2 - 20, 64, place===1?"#ffcc00":"#fff");
      drawText("Drücke R für Neustart", H/2 + 40, 24, "#fff");
      if (keys["r"]) {
        function reset(k, ox, oy) {
          k.x = startX + ox; k.y = startY + oy;
          k.angle = -Math.PI/2;
          k.vx = 0; k.vy = 0; k.speed = 0; k.fwd = 0;
          k.lap = 0; k.passedTop = false; k.passedRight = false; k.wp = 1;
          k.boostTime = 0;
        }
        reset(player, 0, -6);
        reset(cpus[0], 28, 12);
        reset(cpus[1], -28, 12);
        reset(cpus[2], 0, 28);
        startRace();
      }
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
