<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Autorennen</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #game {
    background: #2a8f3a;
    border: 4px solid #444;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  #hud {
    margin-top: 12px;
    font-size: 18px;
    display: flex;
    gap: 30px;
  }
  #hud span { color: #ffd84d; font-weight: bold; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.7);
    text-align: center;
  }
  #overlay h1 { margin: 0 0 10px; font-size: 42px; color: #ffd84d; }
  #overlay p  { margin: 6px 0; font-size: 18px; }
  #overlay button {
    margin-top: 18px;
    padding: 12px 28px;
    font-size: 18px;
    background: #ffd84d;
    color: #000;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #overlay button:hover { background: #ffea8a; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="wrapper">
    <canvas id="game" width="400" height="600"></canvas>
    <div id="hud">
      <div>Punkte: <span id="score">0</span></div>
      <div>Highscore: <span id="hi">0</span></div>
      <div>Speed: <span id="speed">0</span> km/h</div>
    </div>
  </div>

  <div id="overlay">
    <h1 id="title">Autorennen</h1>
    <p id="msg">Steuere mit den Pfeiltasten (oder A/D, W/S).<br>Weiche dem Gegenverkehr aus!</p>
    <p style="opacity:.7">Leertaste = Pause</p>
    <button id="startBtn">Start</button>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreEl = document.getElementById('score');
  const hiEl    = document.getElementById('hi');
  const speedEl = document.getElementById('speed');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl   = document.getElementById('msg');
  const btn     = document.getElementById('startBtn');

  const LANES = 3;
  const ROAD_LEFT = 60;
  const ROAD_RIGHT = W - 60;
  const ROAD_W = ROAD_RIGHT - ROAD_LEFT;
  const LANE_W = ROAD_W / LANES;

  const player = {
    w: 40, h: 70,
    x: W/2 - 20,
    y: H - 110,
    speed: 0,
    maxSpeed: 12,
    accel: 0.12,
    friction: 0.06,
    lateral: 5,
  };

  let enemies = [];
  let stripes = [];
  let keys = {};
  let score = 0;
  let hi = +localStorage.getItem('autorennen.hi') || 0;
  let running = false;
  let paused = false;
  let spawnTimer = 0;
  let spawnInterval = 70;
  let lastTs = 0;

  hiEl.textContent = hi;

  function reset() {
    enemies = [];
    stripes = [];
    for (let i = 0; i < 12; i++) stripes.push(i * 60);
    player.x = W/2 - player.w/2;
    player.speed = 4;
    score = 0;
    spawnTimer = 0;
    spawnInterval = 70;
  }

  function laneX(i) {
    return ROAD_LEFT + i * LANE_W + LANE_W/2;
  }

  function spawnEnemy() {
    const lane = Math.floor(Math.random() * LANES);
    const colors = ['#e74c3c', '#3498db', '#9b59b6', '#f39c12', '#1abc9c'];
    enemies.push({
      x: laneX(lane) - 20,
      y: -80,
      w: 40, h: 70,
      vy: 2 + Math.random() * 2,
      color: colors[Math.floor(Math.random()*colors.length)],
    });
  }

  function rectsHit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update() {
    // Steuerung
    if (keys['ArrowLeft']  || keys['a'] || keys['A']) player.x -= player.lateral;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.lateral;
    if (keys['ArrowUp']    || keys['w'] || keys['W']) player.speed = Math.min(player.maxSpeed, player.speed + player.accel);
    else if (keys['ArrowDown'] || keys['s'] || keys['S']) player.speed = Math.max(1.5, player.speed - player.accel*1.5);
    else player.speed = Math.max(3, player.speed - player.friction);

    // Auf der Straße bleiben
    if (player.x < ROAD_LEFT + 5) player.x = ROAD_LEFT + 5;
    if (player.x + player.w > ROAD_RIGHT - 5) player.x = ROAD_RIGHT - 5 - player.w;

    // Mittelstreifen
    for (let s of stripes) {
      s = s; // dummy
    }
    for (let i = 0; i < stripes.length; i++) {
      stripes[i] += player.speed;
      if (stripes[i] > H) stripes[i] -= H + 40;
    }

    // Gegner bewegen
    for (const e of enemies) {
      e.y += player.speed + e.vy;
    }
    enemies = enemies.filter(e => e.y < H + 100);

    // Spawn
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      spawnEnemy();
      // gelegentlich zwei nebeneinander (aber nie alle Spuren blockieren)
      if (Math.random() < 0.25) {
        const lane = Math.floor(Math.random() * LANES);
        enemies.push({
          x: laneX(lane) - 20,
          y: -160,
          w: 40, h: 70,
          vy: 1 + Math.random()*2,
          color: '#e67e22',
        });
      }
    }

    // Kollisionen
    for (const e of enemies) {
      if (rectsHit(player, e)) {
        gameOver();
        return;
      }
    }

    // Score
    score += player.speed * 0.1;
    scoreEl.textContent = Math.floor(score);
    speedEl.textContent = Math.floor(player.speed * 18);

    // Schwierigkeit steigern
    if (Math.floor(score) > 0 && Math.floor(score) % 200 === 0) {
      if (spawnInterval > 25) spawnInterval = Math.max(25, 70 - Math.floor(score/200) * 3);
      player.maxSpeed = Math.min(20, 12 + Math.floor(score/300));
    }
  }

  function drawRoad() {
    // Gras
    ctx.fillStyle = '#2a8f3a';
    ctx.fillRect(0, 0, W, H);
    // Straße
    ctx.fillStyle = '#3a3a3a';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_W, H);
    // Randstreifen
    ctx.fillStyle = '#ffd84d';
    ctx.fillRect(ROAD_LEFT - 6, 0, 4, H);
    ctx.fillRect(ROAD_RIGHT + 2, 0, 4, H);
    // Spurmarkierungen
    ctx.fillStyle = '#fff';
    for (let lane = 1; lane < LANES; lane++) {
      const x = ROAD_LEFT + lane * LANE_W - 2;
      for (const s of stripes) {
        ctx.fillRect(x, s, 4, 30);
      }
    }
  }

  function drawCar(x, y, w, h, color) {
    // Karosserie
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w, h);
    // Fenster
    ctx.fillStyle = '#1c1c2c';
    ctx.fillRect(x + 4, y + 10, w - 8, 18);
    ctx.fillRect(x + 4, y + h - 28, w - 8, 14);
    // Räder
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 3, y + 8, 5, 14);
    ctx.fillRect(x + w - 2, y + 8, 5, 14);
    ctx.fillRect(x - 3, y + h - 22, 5, 14);
    ctx.fillRect(x + w - 2, y + h - 22, 5, 14);
    // Scheinwerfer
    ctx.fillStyle = '#fff7a8';
    ctx.fillRect(x + 4, y + 2, 8, 4);
    ctx.fillRect(x + w - 12, y + 2, 8, 4);
  }

  function draw() {
    drawRoad();
    // Gegner
    for (const e of enemies) drawCar(e.x, e.y, e.w, e.h, e.color);
    // Spieler
    drawCar(player.x, player.y, player.w, player.h, '#e0e0e0');
  }

  function loop(ts) {
    if (!running) return;
    if (!paused) {
      update();
      if (!running) return;
      draw();
    } else {
      draw();
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffd84d';
      ctx.font = 'bold 36px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSE', W/2, H/2);
      ctx.textAlign = 'left';
    }
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    if (score > hi) {
      hi = Math.floor(score);
      localStorage.setItem('autorennen.hi', hi);
      hiEl.textContent = hi;
    }
    titleEl.textContent = 'Crash!';
    msgEl.innerHTML = `Du hast <b>${Math.floor(score)}</b> Punkte erreicht.<br>Highscore: <b>${hi}</b>`;
    btn.textContent = 'Nochmal';
    overlay.classList.remove('hidden');
  }

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' && running) {
      paused = !paused;
      e.preventDefault();
    }
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  btn.addEventListener('click', start);
})();
</script>
</body>
</html>
